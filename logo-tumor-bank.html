<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <!-- บังคับไม่ให้เบราว์เซอร์จำ Cache หน้า HTML นี้ -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tumor Bank Transport</title> 
    
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Tumor Bank">

    <link rel="icon" type="image/png" href="https://tephfkyo1011.github.io/research-office-dashboard/logo-tumor-bank.png">
    <link rel="apple-touch-icon" href="https://tephfkyo1011.github.io/research-office-dashboard/logo-tumor-bank.png">

    <link rel="manifest" id="dynamic-manifest">

    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background-color: #f4f6f9; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        /* หน้า Loading แสดงสถานะการเปลี่ยนหน้า */
        .loader-box { text-align: center; color: #333; }
        .spinner {
            width: 45px; height: 45px;
            border: 5px solid #e2e8f0;
            border-top: 5px solid #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* สไตล์ของปุ่มติดตั้งแอป (Android/PC) */
        #installAppBtn {
            display: none;
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 8px 15px rgba(37, 99, 235, 0.4);
            cursor: pointer;
            z-index: 9999;
            transition: transform 0.2s, background-color 0.2s;
        }
        #installAppBtn:hover {
            transform: scale(1.05);
            background-color: #1d4ed8;
        }

        /* กล่องคำแนะนำสำหรับ iOS */
        #iosInstallPrompt {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ffffff;
            color: #333;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            z-index: 9999;
            width: 90%;
            max-width: 400px;
            text-align: center;
            border-bottom: 4px solid #2563eb;
        }
        #iosInstallPrompt p { margin: 0 0 10px 0; font-size: 14px; line-height: 1.4; }
        #iosInstallPrompt .icon-share { display: inline-block; font-size: 18px; color: #2563eb; margin: 0 5px; }
        #closeIosPrompt {
            background: #f1f5f9;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            color: #475569;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        #closeIosPrompt:hover { background: #e2e8f0; }
    </style>
</head>
<body>

    <!-- หน้า Loading แสดงสถานะแทน iframe -->
    <div class="loader-box">
        <div class="spinner"></div>
        <h3 style="margin: 0; color: #1e293b;">กำลังนำคุณเข้าสู่ระบบ Tumor Bank Transport...</h3>
        <p style="color: #64748b; font-size: 13px; margin-top: 5px;">โปรดรอสักครู่ ระบบกำลังเปิดหน้าต่างหลัก</p>
    </div>
    
    <button id="installAppBtn">📲 ติดตั้งแอปนี้</button>

    <div id="iosInstallPrompt">
        <p><strong>ติดตั้งแอปบน iOS</strong><br>แตะที่ไอคอน <span class="icon-share">⎋</span> (แชร์) ด้านล่าง<br>แล้วเลือก <strong>"เพิ่มไปยังหน้าจอโฮม"</strong><br>(Add to Home Screen)</p>
        <button id="closeIosPrompt">รับทราบ</button>
    </div>

    <script>
        // ==========================================
        // 🚀 1. ดักจับ LINE In-App Browser และบังคับเปิดใน Browser หลัก
        // ==========================================
        (function bypassLineBrowser() {
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            var isLine = (ua.indexOf("Line") > -1 || ua.indexOf("LINE") > -1);
            
            if (isLine) {
                var currentFullUrl = window.location.href;
                
                // สำหรับ Android: บังคับเปิดด้วย Chrome Intent
                if (/android/i.test(ua)) {
                    var chromeIntent = "intent://" + currentFullUrl.replace(/^https?:\/\//, '') + 
                                       "#Intent;scheme=https;package=com.android.chrome;end;";
                    window.location.href = chromeIntent;
                } 
                // สำหรับ iOS: เติมพารามิเตอร์เพื่อให้ LINE เปิดผ่าน External Browser
                else if (/iphone|ipad|ipod/i.test(ua)) {
                    if (currentFullUrl.indexOf('openExternalBrowser=1') === -1) {
                        var joinChar = currentFullUrl.indexOf('?') > -1 ? '&' : '?';
                        window.location.href = currentFullUrl + joinChar + 'openExternalBrowser=1';
                    }
                }
            }
        })();

        // ==========================================
        // 🔥 2. Redirect ตรงไปยัง Apps Script Web App (พร้อมส่งต่อ Parameter)
        // ==========================================
        const baseUrl = "https://script.google.com/macros/s/AKfycbzpYzeJ2B45m74uWdLYISaygjGv76GN6-p-KTPxhXiIzjcvzf_Pkj6Z97Lgd-i50PeSCg/exec";
        const searchParams = window.location.search;
        const joinChar = searchParams ? '&' : '?';
        const targetUrl = baseUrl + searchParams + joinChar + "v=" + new Date().getTime();

        setTimeout(() => {
            window.location.replace(targetUrl);
        }, 600);

        // ==========================================
        // 3. PWA Dynamic Manifest และ Service Worker
        // ==========================================
        const currentUrl = window.location.origin + window.location.pathname;

        const manifestData = {
            "id": "app-tumor-bank",
            "name": "Tumor Bank Transport",
            "short_name": "Tumor Bank",
            "display": "standalone",
            "scope": currentUrl, 
            "start_url": currentUrl, 
            "background_color": "#ffffff",
            "theme_color": "#2563eb",
            "icons": [
                {
                    "src": "https://tephfkyo1011.github.io/research-office-dashboard/logo-tumor-bank.png",
                    "sizes": "512x512",
                    "type": "image/png",
                    "purpose": "any maskable"
                }
            ]
        };

        const base64Manifest = btoa(unescape(encodeURIComponent(JSON.stringify(manifestData))));
        document.getElementById('dynamic-manifest').href = 'data:application/manifest+json;base64,' + base64Manifest;

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
            .catch(err => console.log('Service Worker Error:', err));
        }

        // ==========================================
        // 4. การจัดการปุ่มติดตั้งแอป (Android & iOS)
        // ==========================================
        let deferredPrompt;
        const installBtn = document.getElementById('installAppBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        window.addEventListener('appinstalled', () => {
            installBtn.style.display = 'none';
        });

        const isIos = () => /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
        const isInStandaloneMode = () => ('standalone' in window.navigator && window.navigator.standalone) || window.matchMedia('(display-mode: standalone)').matches;

        if (isIos() && !isInStandaloneMode()) {
            const iosPrompt = document.getElementById('iosInstallPrompt');
            document.getElementById('closeIosPrompt').addEventListener('click', () => {
                iosPrompt.style.display = 'none';
            });
            iosPrompt.style.display = 'block';
        }
    </script>

</body>
</html>
