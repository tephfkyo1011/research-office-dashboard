<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard ครุภัณฑ์ HSR</title>
    
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ครุภัณฑ์ HSR">

    <link rel="icon" type="image/jpeg" href="logo-hsr-dashboard.jpg">
    <link rel="apple-touch-icon" href="logo-hsr-dashboard.jpg">

    <link rel="manifest" href='data:application/manifest+json,{
      "name": "Dashboard สรุปข้อมูลครุภัณฑ์",
      "short_name": "ครุภัณฑ์ HSR",
      "display": "standalone",
      "start_url": ".",
      "background_color": "#ffffff",
      "theme_color": "#2563eb",
      "icons": [
        {
          "src": "logo-hsr-dashboard.jpg",
          "sizes": "512x512",
          "type": "image/jpeg",
          "purpose": "any maskable"
        }
      ]
    }'>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; 
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe src="https://script.google.com/a/macros/mahidol.ac.th/s/AKfycbxbcCDzD5mabYhFnw0MP00-ZkOoCJg4bZc-daedF9GhHIq0xVUMMIKmB7l4_69oyNQ/exec" allow="fullscreen"></iframe>
    
    <script>
        if ('service-worker' in navigator) {
            const swCode = `self.addEventListener('fetch', function() {});`;
            const blob = new Blob([swCode], {type: 'text/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(blob));
        }
    </script>

</body>
</html>
