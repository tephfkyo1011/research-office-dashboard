<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Research Office Portal - KYOGI</title>
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' https:;">

    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&family=Sarabun:wght@300;400&display=swap" as="style">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&family=Sarabun:wght@300;400&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="https://tephfkyo1011.github.io/research-office-dashboard/Research_Office_KYOGI.png">
    
    <style>
        /* ...ใส่ CSS เดิม... */
    </style>
</head>
<body>

    <script>
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearSearch');
        let usage = JSON.parse(localStorage.getItem('usage') || '{}');

        /* 🟢 5. Mini AI Search: พจนานุกรม Synonyms */
        const synonyms = {
            "แก๊ส": ["gas", "ถัง"],
            "จอง": ["booking", "reserve", "ประชุม"],
            "ตู้แช่": ["freezer", "ln2", "ไนโตรเจน", "อุณหภูมิ"],
            "ซ่อม": ["repair", "fix", "แอร์", "วิศวกรรม"],
            "ลา": ["leave", "ป่วย", "พักร้อน"],
            "ครุภัณฑ์": ["asset", "ของ"]
        };

        function getExpandedTerms(term) {
            let expanded = [term];
            for (const [key, syns] of Object.entries(synonyms)) {
                if (term === key || syns.includes(term)) {
                    expanded = expanded.concat(syns, [key]);
                }
            }
            return [...new Set(expanded)]; // ตัดคำซ้ำออก
        }

        /* (ฟังก์ชัน toggleDark, keyboard shortcuts, fuzzyMatch, scoreMatch เหมือนเดิม) */

        let debounceTimer;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                performSearch(e.target.value.toLowerCase().trim());
            }, 120);
        });

        function performSearch(term) {
            clearBtn.style.display = term.length > 0 ? 'block' : 'none';
            
            // 🟢 ขยายคำค้นหาด้วย Synonyms
            const rawTerms = term.split(' ').filter(t => t.length > 0);
            let searchTerms = [];
            rawTerms.forEach(t => searchTerms.push(...getExpandedTerms(t)));

            // 🟢 6. Normalize Usage Score ป้องกัน Bias (หาค่าคนกดมากที่สุดมาหาร)
            const usageValues = Object.values(usage);
            const maxUsage = usageValues.length > 0 ? Math.max(...usageValues, 1) : 1;

            document.querySelectorAll('.grid').forEach(grid => {
                let hasVisible = false;

                grid.querySelectorAll('.card').forEach(card => {
                    const searchText = card.dataset.search || '';
                    let match = false;
                    let totalScore = 0;

                    if (term === '') {
                        match = true;
                        card.style.order = card.dataset.defaultOrder; 
                    } else {
                        // เช็คกับคำที่ขยายความแล้ว
                        match = searchTerms.some(t => searchText.includes(t) || fuzzyMatch(searchText, t));
                        
                        if (match) {
                            searchTerms.forEach(t => totalScore += scoreMatch(card, t));
                            
                            // Normalized Booster (ไม่เกิน 20 คะแนน)
                            const userBoost = ((usage[card.dataset.name] || 0) / maxUsage) * 20;
                            totalScore += userBoost;
                            
                            card.style.order = 1000 - Math.round(totalScore); 
                        }
                    }

                    card.style.display = match ? 'flex' : 'none';
                    if (match) hasVisible = true;
                });

                if (grid.id === 'grid-pinned') {
                    document.getElementById('pinned-section').style.display = hasVisible ? 'block' : 'none';
                } else {
                    const sectionTitle = grid.previousElementSibling;
                    if (sectionTitle?.classList.contains('section-title')) {
                        sectionTitle.style.display = hasVisible ? 'flex' : 'none';
                    }
                }
            });
        }

        // (โค้ด Pinned, Service Worker Controller, ฯลฯ เหมือนเวอร์ชันก่อนหน้า)
    </script>
</body>
</html>
