<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Research Office Portal - KYOGI</title>
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' https:;">

    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&family=Sarabun:wght@300;400&display=swap" as="style">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&family=Sarabun:wght@300;400&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="https://tephfkyo1011.github.io/research-office-dashboard/Research_Office_KYOGI.png">
    
    <style>
        :root {
            --primary-grad: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            --bg-color: #f4f6f9;
            --text-main: #2c3e50;
            --text-sub: #6c757d;
            --gold: #ffc107;
            --col-it: #007bff;
            --col-hr: #e83e8c;
            --col-central: #20c997;
            --col-fun: #6f42c1;
            --hl-bg: rgba(255, 193, 7, 0.4);
        }

        body.dark {
            --bg-color: #1e1e2f;
            --text-main: #ffffff;
            --text-sub: #bbbbbb;
            --hl-bg: rgba(255, 193, 7, 0.6);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Sarabun', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            margin: 0; padding-bottom: 40px; 
            transition: background-color 0.3s ease, color 0.3s ease; 
        }

        header {
            background: var(--primary-grad); padding: 50px 20px 90px; text-align: center; color: white;
            border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            position: relative;
        }

        .portal-brand-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 10px;
        }
        .portal-main-logo {
            max-width: 100px; height: auto; border-radius: 20px; background: white; padding: 5px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); margin-bottom: 15px; transition: transform 0.3s ease;
        }
        .portal-main-logo:hover { transform: scale(1.05) rotate(-3deg); }

        h1 { font-family: 'Prompt', sans-serif; font-size: 1.6rem; margin: 0; font-weight: 600; }
        p.subtitle { font-size: 0.9rem; margin-top: 5px; opacity: 0.9; }

        .btn-header {
            position: absolute; top: 15px; padding: 8px 12px; border: none; border-radius: 12px;
            cursor: pointer; background: rgba(255, 255, 255, 0.2); color: white; font-size: 1.2rem; backdrop-filter: blur(5px);
            transition: all 0.3s ease; display: flex; align-items: center; gap: 5px; font-family: 'Prompt', sans-serif;
        }
        .btn-header:hover { background: rgba(255, 255, 255, 0.3); transform: scale(1.05); }
        .btn-darkmode { right: 20px; }
        .btn-install { right: 75px; font-size: 0.9rem; display: none; } /* 🟢 6. ปุ่มติดตั้ง PWA */

        .search-wrapper { 
            position: sticky; top: 15px; z-index: 100; padding: 0 15px; margin-top: -35px;
            max-width: 630px; margin-left: auto; margin-right: auto;
        }
        
        .search-box {
            width: 100%; display: block; margin: 0 auto;
            padding: 15px 40px 15px 25px; border-radius: 30px; border: none; box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            font-family: 'Prompt', sans-serif; font-size: 1rem; outline: none;
            backdrop-filter: blur(10px); background: rgba(255,255,255,0.9); color: #2c3e50;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        body.dark .search-box { background: rgba(40,40,60,0.8); color: #ffffff; }

        .clear-search {
            position: absolute; right: 30px; top: 50%; transform: translateY(-50%);
            cursor: pointer; color: #6c757d; font-size: 1.2rem; display: none; transition: color 0.2s;
        }
        .clear-search:hover { color: #e74c3c; }

        .container { padding: 20px 15px; max-width: 900px; margin: 0 auto; }
        
        .notice {
            background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba;
            padding: 15px; border-radius: 12px; margin-bottom: 20px; font-size: 0.85rem; text-align: center; line-height: 1.6;
        }
        body.dark .notice { background-color: #4a3a10; color: #ffeb99; border-color: #665010; }

        .section-title {
            font-family: 'Prompt', sans-serif; font-size: 1.1rem; margin: 30px 0 15px;
            display: flex; align-items: center; font-weight: 600; border-left: 5px solid #ccc; padding-left: 10px;
        }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(3, 1fr); } }

        .card {
            border-radius: 15px; padding: 15px 10px; text-decoration: none; display: flex; flex-direction: column; align-items: center; text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02); min-height: 140px; border-top: 4px solid transparent; color: var(--text-main);
            backdrop-filter: blur(10px); background: rgba(255,255,255,0.8); position: relative;
            animation: fadeInCard 0.5s ease backwards;
            transition: all 0.3s ease, transform 0.25s ease;
            order: 999;
        }
        body.dark .card { background: rgba(40,40,60,0.6); }
        
        @keyframes fadeInCard {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        .card:hover { transform: translateY(-6px); box-shadow: 0 12px 25px rgba(0,0,0,0.08), 0 0 0 1px rgba(255,255,255,0.1) inset; }
        body.dark .card:hover { box-shadow: 0 12px 25px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05) inset; }
        .card:active { transform: scale(0.95); }

        .card.last-used { outline: 2px solid #28a745; outline-offset: -2px; }

        .icon-circle {
            width: 60px; height: 60px; border-radius: 18px; display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; margin-bottom: 10px; background: rgba(248,249,250,0.8); overflow: hidden;
        }
        body.dark .icon-circle { background: rgba(58,58,82,0.8); }
        .icon-circle img { width: 100%; height: 100%; object-fit: cover; }

        .card-title { font-family: 'Prompt', sans-serif; font-size: 0.85rem; font-weight: 500; line-height: 1.2; margin-bottom: 4px; }
        .card-desc { font-size: 0.7rem; color: var(--text-sub); }

        .badge-lan { position: absolute; top: 5px; left: 5px; font-size: 0.6rem; background: #ffebee; color: #c62828; padding: 1px 5px; border-radius: 4px; font-weight: bold; }
        body.dark .badge-lan { background: #5c1818; color: #ffb3b3; }
        
        .pin { position: absolute; top: 5px; right: 5px; font-size: 1rem; color: #ccc; cursor: pointer; padding: 2px; transition: color 0.2s; z-index: 10; }
        body.dark .pin { color: #666; }
        
        .card.pinned { border: 1px solid var(--gold); }
        body:not(.dark) .card.pinned { background: rgba(255,253,240,0.9); }
        body.dark .card.pinned { background: rgba(53,48,24,0.8); }
        .card.pinned .pin { color: var(--gold); }

        mark { background-color: var(--hl-bg); color: inherit; padding: 0 2px; border-radius: 4px; font-weight: bold; }

        .footer { text-align: center; font-size: 0.7rem; color: var(--text-sub); margin-top: 40px; padding: 20px; line-height: 1.5; }
    </style>
</head>
<body>

    <script>
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearSearch');
        let usage = JSON.parse(localStorage.getItem('usage') || '{}');

        /* 🟢 5. Mini AI Search: พจนานุกรม Synonyms */
        const synonyms = {
            "แก๊ส": ["gas", "ถัง"],
            "จอง": ["booking", "reserve", "ประชุม"],
            "ตู้แช่": ["freezer", "ln2", "ไนโตรเจน", "อุณหภูมิ"],
            "ซ่อม": ["repair", "fix", "แอร์", "วิศวกรรม"],
            "ลา": ["leave", "ป่วย", "พักร้อน"],
            "ครุภัณฑ์": ["asset", "ของ"]
        };

        function getExpandedTerms(term) {
            let expanded = [term];
            for (const [key, syns] of Object.entries(synonyms)) {
                if (term === key || syns.includes(term)) {
                    expanded = expanded.concat(syns, [key]);
                }
            }
            return [...new Set(expanded)]; // ตัดคำซ้ำออก
        }

        /* (ฟังก์ชัน toggleDark, keyboard shortcuts, fuzzyMatch, scoreMatch เหมือนเดิม) */

        let debounceTimer;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                performSearch(e.target.value.toLowerCase().trim());
            }, 120);
        });

        function performSearch(term) {
            clearBtn.style.display = term.length > 0 ? 'block' : 'none';
            
            // 🟢 ขยายคำค้นหาด้วย Synonyms
            const rawTerms = term.split(' ').filter(t => t.length > 0);
            let searchTerms = [];
            rawTerms.forEach(t => searchTerms.push(...getExpandedTerms(t)));

            // 🟢 6. Normalize Usage Score ป้องกัน Bias (หาค่าคนกดมากที่สุดมาหาร)
            const usageValues = Object.values(usage);
            const maxUsage = usageValues.length > 0 ? Math.max(...usageValues, 1) : 1;

            document.querySelectorAll('.grid').forEach(grid => {
                let hasVisible = false;

                grid.querySelectorAll('.card').forEach(card => {
                    const searchText = card.dataset.search || '';
                    let match = false;
                    let totalScore = 0;

                    if (term === '') {
                        match = true;
                        card.style.order = card.dataset.defaultOrder; 
                    } else {
                        // เช็คกับคำที่ขยายความแล้ว
                        match = searchTerms.some(t => searchText.includes(t) || fuzzyMatch(searchText, t));
                        
                        if (match) {
                            searchTerms.forEach(t => totalScore += scoreMatch(card, t));
                            
                            // Normalized Booster (ไม่เกิน 20 คะแนน)
                            const userBoost = ((usage[card.dataset.name] || 0) / maxUsage) * 20;
                            totalScore += userBoost;
                            
                            card.style.order = 1000 - Math.round(totalScore); 
                        }
                    }

                    card.style.display = match ? 'flex' : 'none';
                    if (match) hasVisible = true;
                });

                if (grid.id === 'grid-pinned') {
                    document.getElementById('pinned-section').style.display = hasVisible ? 'block' : 'none';
                } else {
                    const sectionTitle = grid.previousElementSibling;
                    if (sectionTitle?.classList.contains('section-title')) {
                        sectionTitle.style.display = hasVisible ? 'flex' : 'none';
                    }
                }
            });
        }

        // (โค้ด Pinned, Service Worker Controller, ฯลฯ เหมือนเวอร์ชันก่อนหน้า)
    </script>
</body>
</html>
