<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ออฟไลน์ - Research Office Portal</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&family=Sarabun:wght@400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f4f6f9;
            --text-main: #2c3e50;
            --text-sub: #6c757d;
            --primary-grad: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
        }

        /* รองรับ Dark mode ผ่าน System preference เป็นพื้นฐาน */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #1e1e2f;
                --text-main: #ffffff;
                --text-sub: #bbbbbb;
            }
        }

        /* คลาส Dark mode ที่ดึงจาก localStorage */
        body.dark {
            --bg-color: #1e1e2f;
            --text-main: #ffffff;
            --text-sub: #bbbbbb;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Sarabun', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0;
            background-color: var(--bg-color); 
            color: var(--text-main); 
            text-align: center; 
            padding: 20px; 
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        .icon-container {
            font-size: 5rem;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
        }
        
        h1 { 
            font-family: 'Prompt', sans-serif;
            font-size: 1.8rem; 
            margin: 0 0 10px 0; 
            font-weight: 600;
        }
        
        p { 
            color: var(--text-sub); 
            line-height: 1.6;
            margin-bottom: 35px;
            font-size: 1rem;
            max-width: 400px;
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .btn { 
            padding: 12px 28px; 
            background: var(--primary-grad); 
            color: white; 
            text-decoration: none; 
            border-radius: 30px; 
            font-family: 'Prompt', sans-serif;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
            border: none;
            cursor: pointer;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.2);
        }
        
        .btn:active {
            transform: translateY(1px);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-main);
            border: 2px solid #ccc;
            box-shadow: none;
        }
        
        body.dark .btn-outline {
            border-color: #555;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>
    <div class="icon-container">📡</div>
    <h1>ขาดการเชื่อมต่ออินเทอร์เน็ต</h1>
    <p>ไม่สามารถโหลดเนื้อหาได้ในขณะนี้<br>โปรดตรวจสอบสัญญาณ Wi-Fi หรืออินเทอร์เน็ตของคุณแล้วลองใหม่อีกครั้ง</p>
    
    <div class="btn-group">
        <!-- ปุ่มย้อนกลับไปหน้าแรก (ซึ่งสามารถโหลดได้ตอนออฟไลน์เพราะ Cache ไว้แล้ว) -->
        <a href="./index.html" class="btn">กลับหน้าแรก</a>
        <!-- ปุ่มลองโหลดหน้านี้ใหม่ -->
        <button onclick="window.location.reload()" class="btn btn-outline">ลองอีกครั้ง</button>
    </div>

    <script>
        // ซิงค์ Dark Mode ให้ตรงกับหน้าเว็บหลัก
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'dark') {
            document.body.classList.add('dark');
        }
    </script>
</body>
</html>
