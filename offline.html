<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ออฟไลน์ - KYOGI Portal</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
            background-color: #f4f6f9; 
            color: #2c3e50; 
            text-align: center; 
            padding: 20px; 
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 10px;
            animation: pulse 2s infinite;
        }
        h1 { 
            font-size: 2rem; 
            margin: 0 0 10px 0; 
            color: #0f2027;
        }
        p { 
            color: #6c757d; 
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .btn { 
            padding: 12px 24px; 
            background: #0f2027; 
            color: white; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:hover {
            background: #203a43;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .btn:active {
            transform: translateY(0);
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="icon">📡</div>
    <h1>ขาดการเชื่อมต่ออินเทอร์เน็ต</h1>
    <p>ดูเหมือนว่าคุณจะออฟไลน์อยู่ หรือระบบเครือข่ายมีปัญหา<br>โปรดตรวจสอบการเชื่อมต่อของคุณแล้วลองใหม่อีกครั้ง</p>
    <a href="./index.html" class="btn">ลองโหลดใหม่</a>
</body>
</html>
