<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ระบบลงเวลาปฏิบัติงานนอกเวลา</title> 
    
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ลงเวลา OT">

    <link rel="icon" type="image/png" href="https://tephfkyo1011.github.io/research-office-dashboard/logo-ot-time.png">
    <link rel="apple-touch-icon" href="https://tephfkyo1011.github.io/research-office-dashboard/logo-ot-time.png">

    <link rel="manifest" id="dynamic-manifest">

    <style>
        /* 🌟 บังคับ body ให้เต็มจอ 100% และห้ามเลื่อนเด็ดขาด */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #f4f6f9; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        /* 🌟 สร้างกล่องพิเศษสำหรับ iOS เพื่อให้เลื่อนเฉพาะข้างใน Iframe ได้ลื่นไหล */
        .iframe-wrapper {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            -webkit-overflow-scrolling: touch;
            overflow-y: auto;
            width: 100%;
            height: 100%;
        }

        /* 🌟 เทคนิคหลอก iOS: ตั้ง width=1px แต่ min-width=100% ป้องกันการขยายกรอบมั่วๆ */
        iframe { 
            width: 1px; 
            min-width: 100%; 
            height: 100%; 
            border: none; 
            display: block;
            transition: opacity 0.3s ease; /* เพิ่มลูกเล่นตอนเปลี่ยนหน้า */
        }

        /* สไตล์ของปุ่มติดตั้งแอป (Android/PC) */
        #installAppBtn {
            display: none; position: fixed; bottom: 30px; right: 30px;
            background-color: #2563eb; color: white; border: none;
            border-radius: 50px; padding: 12px 24px; font-size: 16px;
            font-weight: bold; box-shadow: 0 8px 15px rgba(37, 99, 235, 0.4);
            cursor: pointer; z-index: 9999; transition: transform 0.2s, background-color 0.2s;
        }
        #installAppBtn:hover { transform: scale(1.05); background-color: #1d4ed8; }

        /* กล่องคำแนะนำสำหรับ iOS */
        #iosInstallPrompt {
            display: none; position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%); background-color: #ffffff; color: #333;
            padding: 15px 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            z-index: 9999; width: 90%; max-width: 400px; text-align: center;
            border-bottom: 4px solid #2563eb;
        }
        #iosInstallPrompt p { margin: 0 0 10px 0; font-size: 14px; line-height: 1.4; }
        #iosInstallPrompt .icon-share { display: inline-block; font-size: 18px; color: #2563eb; margin: 0 5px; }
        #closeIosPrompt {
            background: #f1f5f9; border: none; padding: 8px 16px;
            border-radius: 6px; color: #475569; font-weight: bold;
            cursor: pointer; font-size: 14px;
        }
        #closeIosPrompt:hover { background: #e2e8f0; }
    </style>
</head>
<body>

    <div class="iframe-wrapper">
        <iframe id="mainIframe" src="https://script.google.com/macros/s/AKfycbzO_77wN89GjfbaoqkcH_j9iziyK-_mbKP_8PGnUuvPOsnjkyx2HZWo1naZJWwuuo8wVg/exec" allow="fullscreen"></iframe>
    </div>
    
    <button id="installAppBtn">📲 ติดตั้งแอปนี้</button>

    <div id="iosInstallPrompt">
        <p><strong>ติดตั้งแอปบน iOS</strong><br>แตะที่ไอคอน <span class="icon-share">⎋</span> (แชร์) ด้านล่าง<br>แล้วเลือก <strong>"เพิ่มไปยังหน้าจอโฮม"</strong><br>(Add to Home Screen)</p>
        <button id="closeIosPrompt">รับทราบ</button>
    </div>

    <script>
        // ==========================================
        // 🌟 1. ระบบรับสัญญาณวิทยุจาก Iframe (แก้บั๊ก iOS สลับหน้าแล้วค้าง)
        // ==========================================
        window.addEventListener('message', function(event) {
            if (event.data && event.data.action === 'changePage') {
                const iframe = document.getElementById('mainIframe');
                if (iframe) {
                    iframe.style.opacity = '0.5'; // ทำเอฟเฟกต์เฟดตอนโหลด
                    iframe.src = event.data.newUrl; // สั่งเปลี่ยนหน้าต่างอย่างปลอดภัย
                    iframe.onload = function() {
                        iframe.style.opacity = '1';
                        // สั่งให้เลื่อนจอขึ้นบนสุดเมื่อเปลี่ยนหน้าเสร็จ
                        document.querySelector('.iframe-wrapper').scrollTop = 0; 
                    };
                }
            }
        });

        // ==========================================
        // 2. ระบบ PWA และ Manifest เดิมของพี่ (คงไว้เหมือนเดิมเป๊ะ)
        // ==========================================
        const currentUrl = window.location.origin + window.location.pathname;

        const manifestData = {
            "id": "app-ot-time", 
            "name": "ระบบลงเวลาปฏิบัติงานนอกเวลา",
            "short_name": "ลงเวลา OT",
            "display": "standalone",
            "scope": currentUrl, 
            "start_url": currentUrl, 
            "background_color": "#ffffff",
            "theme_color": "#2563eb",
            "icons": [
                {
                    "src": "https://tephfkyo1011.github.io/research-office-dashboard/logo-ot-time.png",
                    "sizes": "512x512",
                    "type": "image/png",
                    "purpose": "any maskable"
                }
            ]
        };

        const base64Manifest = btoa(unescape(encodeURIComponent(JSON.stringify(manifestData))));
        document.getElementById('dynamic-manifest').href = 'data:application/manifest+json;base64,' + base64Manifest;

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
            .catch(err => console.log('Service Worker Error:', err));
        }

        let deferredPrompt;
        const installBtn = document.getElementById('installAppBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('ผู้ใช้ยอมรับการติดตั้ง');
                    installBtn.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        window.addEventListener('appinstalled', () => {
            installBtn.style.display = 'none';
        });

        const isIos = () => {
            const userAgent = window.navigator.userAgent.toLowerCase();
            return /iphone|ipad|ipod/.test(userAgent);
        };

        const isInStandaloneMode = () => {
            return ('standalone' in window.navigator && window.navigator.standalone) || 
                   window.matchMedia('(display-mode: standalone)').matches;
        };

        if (isIos() && !isInStandaloneMode()) {
            const iosPrompt = document.getElementById('iosInstallPrompt');
            const closeIosBtn = document.getElementById('closeIosPrompt');
            
            iosPrompt.style.display = 'block';
            
            closeIosBtn.addEventListener('click', () => {
                iosPrompt.style.display = 'none';
            });
        }
    </script>

</body>
</html>
