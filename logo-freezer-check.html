<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตรวจสอบตู้แช่ & LN2</title> 
    
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ตรวจสอบตู้แช่">

    <link rel="icon" type="image/png" href="./logo-freezer-check.png">
    <link rel="apple-touch-icon" href="./logo-freezer-check.png">

    <link rel="manifest" id="dynamic-manifest">

    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        iframe { width: 100%; height: 100%; border: none; }

        /* ปุ่มติดตั้งสำหรับ Android/PC */
        #installAppBtn {
            display: none;
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 8px 15px rgba(37, 99, 235, 0.4);
            cursor: pointer;
            z-index: 9999;
            transition: transform 0.2s, background-color 0.2s;
        }
        #installAppBtn:hover {
            transform: scale(1.05);
            background-color: #1d4ed8;
        }

        /* กล่องคำแนะนำสำหรับ iOS */
        #iosInstallPrompt {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ffffff;
            color: #333;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            z-index: 9999;
            width: 90%;
            max-width: 400px;
            text-align: center;
            border-bottom: 4px solid #2563eb;
        }
        #iosInstallPrompt p { margin: 0 0 10px 0; font-size: 14px; line-height: 1.4; }
        #iosInstallPrompt .icon-share { display: inline-block; font-size: 18px; color: #2563eb; margin: 0 5px; }
        #closeIosPrompt {
            background: #f1f5f9;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            color: #475569;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        #closeIosPrompt:hover { background: #e2e8f0; }
    </style>
</head>
<body>

    <iframe src="https://script.google.com/a/macros/mahidol.ac.th/s/AKfycbzPxW-MM3P4RpWlPq4n3hP2iwf8DtHBgydaBWngDZ9sho9K4MC2seH5t8eGMZWRjmvy/exec" allow="fullscreen"></iframe>
    
    <button id="installAppBtn">📲 ติดตั้งแอปนี้</button>

    <div id="iosInstallPrompt">
        <p><strong>ติดตั้งแอปบน iOS</strong><br>แตะที่ไอคอน <span class="icon-share">⎋</span> (แชร์) ด้านล่าง<br>แล้วเลือก <strong>"เพิ่มไปยังหน้าจอโฮม"</strong><br>(Add to Home Screen)</p>
        <button id="closeIosPrompt">รับทราบ</button>
    </div>

    <script>
        // 1. สร้าง Manifest และเข้ารหัสเพื่อป้องกัน Syntax Error
        const manifestData = {
            "id": "freezer-check-app", 
            "scope": "./", 
            "name": "ระบบตรวจสอบตู้แช่ & LN2",
            "short_name": "ตรวจสอบตู้แช่",
            "display": "standalone",
            "start_url": window.location.href, 
            "background_color": "#ffffff",
            "theme_color": "#2563eb",
            "icons": [
                {
                    "src": "./logo-freezer-check.png",
                    "sizes": "512x512",
                    "type": "image/png",
                    "purpose": "any maskable"
                }
            ]
        };
        
        const blob = new Blob([JSON.stringify(manifestData)], { type: 'application/manifest+json' });
        const manifestURL = URL.createObjectURL(blob);
        document.getElementById('dynamic-manifest').href = manifestURL;
        
        // 2. เรียกใช้ Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
            .catch(err => console.log('Service Worker Error:', err));
        }

        // 3. จัดการปุ่มติดตั้งแอป (Android & Chrome)
        let deferredPrompt;
        const installBtn = document.getElementById('installAppBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); 
            deferredPrompt = e; 
            installBtn.style.display = 'block'; 
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt(); 
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('ผู้ใช้ยอมรับการติดตั้ง');
                    installBtn.style.display = 'none'; 
                }
                deferredPrompt = null;
            }
        });

        window.addEventListener('appinstalled', () => {
            installBtn.style.display = 'none';
        });

        // 4. 🍏 ตรวจจับและแสดงคำแนะนำสำหรับ iOS
        const isIos = () => {
            const userAgent = window.navigator.userAgent.toLowerCase();
            return /iphone|ipad|ipod/.test(userAgent);
        };

        // เช็คว่าทำงานแบบ Standalone (ติดตั้งเป็นแอปแล้ว) หรือยัง
        const isInStandaloneMode = () => {
            return ('standalone' in window.navigator && window.navigator.standalone) || 
                   window.matchMedia('(display-mode: standalone)').matches;
        };

        if (isIos() && !isInStandaloneMode()) {
            const iosPrompt = document.getElementById('iosInstallPrompt');
            const closeIosBtn = document.getElementById('closeIosPrompt');
            
            // โชว์ popup สำหรับ iOS
            iosPrompt.style.display = 'block';
            
            closeIosBtn.addEventListener('click', () => {
                iosPrompt.style.display = 'none';
            });
        }
    </script>

</body>
</html>
