<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตรวจสอบตู้แช่ & LN2</title> 
    
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ตรวจสอบตู้แช่">

    <link rel="icon" type="image/png" href="./logo-freezer-check.png">
    <link rel="apple-touch-icon" href="./logo-freezer-check.png">

    <link rel="manifest" href='data:application/manifest+json,{
        "name": "ระบบตรวจสอบตู้แช่ & LN2",
        "short_name": "ตรวจสอบตู้แช่",
        "display": "standalone",
        "start_url": ".",
        "background_color": "#ffffff",
        "theme_color": "#2563eb",
        "icons": [
            {
                "src": "./logo-freezer-check.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any maskable"
            }
        ]
    }'>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #f4f6f9; font-family: sans-serif; }
        iframe { width: 100%; height: 100%; border: none; }

        /* สไตล์ของปุ่มติดตั้งแอป */
        #installAppBtn {
            display: none;
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 8px 15px rgba(37, 99, 235, 0.4);
            cursor: pointer;
            z-index: 9999;
            transition: transform 0.2s, background-color 0.2s;
        }
        #installAppBtn:hover {
            transform: scale(1.05);
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <iframe src="https://script.google.com/a/macros/mahidol.ac.th/s/AKfycbzPxW-MM3P4RpWlPq4n3hP2iwf8DtHBgydaBWngDZ9sho9K4MC2seH5t8eGMZWRjmvy/exec" allow="fullscreen"></iframe>
    
    <button id="installAppBtn">📲 ติดตั้งแอปนี้</button>

    <script>
        // 1. เรียกใช้ Service Worker ตัวเดียวที่มีอยู่ในโปรเจกต์
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
            .catch(err => console.log('Service Worker Error:', err));
        }

        // 2. โค้ดสำหรับจัดการปุ่มติดตั้งแอป
        let deferredPrompt;
        const installBtn = document.getElementById('installAppBtn');

        // ดักจับเมื่อเบราว์เซอร์พร้อมให้ติดตั้ง
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); 
            deferredPrompt = e; 
            installBtn.style.display = 'block'; 
        });

        // เมื่อผู้ใช้กดปุ่มติดตั้งของเรา
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt(); 
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('ผู้ใช้ยอมรับการติดตั้ง');
                    installBtn.style.display = 'none'; 
                }
                deferredPrompt = null;
            }
        });

        // ซ่อนปุ่มอัตโนมัติ ถ้าแอปนี้ถูกติดตั้งลงเครื่องไปแล้ว
        window.addEventListener('appinstalled', () => {
            installBtn.style.display = 'none';
        });
    </script>

</body>
</html>
