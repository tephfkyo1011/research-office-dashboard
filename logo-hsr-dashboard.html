<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard ครุภัณฑ์ HSR</title> 
    
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ครุภัณฑ์ HSR">

    <link rel="icon" type="image/png" href="https://tephfkyo1011.github.io/research-office-dashboard/logo-hsr-dashboard.png">
    <link rel="apple-touch-icon" href="https://tephfkyo1011.github.io/research-office-dashboard/logo-hsr-dashboard.png">

    <link rel="manifest" id="dynamic-manifest">

    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        iframe { width: 100%; height: 100%; border: none; }

        /* สไตล์ของปุ่มติดตั้งแอป (Android/PC) */
        #installAppBtn {
            display: none;
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 8px 15px rgba(37, 99, 235, 0.4);
            cursor: pointer;
            z-index: 9999;
            transition: transform 0.2s, background-color 0.2s;
        }
        #installAppBtn:hover {
            transform: scale(1.05);
            background-color: #1d4ed8;
        }

        /* กล่องคำแนะนำสำหรับ iOS */
        #iosInstallPrompt {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ffffff;
            color: #333;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            z-index: 9999;
            width: 90%;
            max-width: 400px;
            text-align: center;
            border-bottom: 4px solid #2563eb;
        }
        #iosInstallPrompt p { margin: 0 0 10px 0; font-size: 14px; line-height: 1.4; }
        #iosInstallPrompt .icon-share { display: inline-block; font-size: 18px; color: #2563eb; margin: 0 5px; }
        #closeIosPrompt {
            background: #f1f5f9;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            color: #475569;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        #closeIosPrompt:hover { background: #e2e8f0; }
    </style>
</head>
<body>

    <iframe src="https://script.google.com/macros/s/AKfycbxbcCDzD5mabYhFnw0MP00-ZkOoCJg4bZc-daedF9GhHIq0xVUMMIKmB7l4_69oyNQ/exec" allow="fullscreen"></iframe>
    
    <button id="installAppBtn">📲 ติดตั้งแอปนี้</button>

    <div id="iosInstallPrompt">
        <p><strong>ติดตั้งแอปบน iOS</strong><br>แตะที่ไอคอน <span class="icon-share">⎋</span> (แชร์) ด้านล่าง<br>แล้วเลือก <strong>"เพิ่มไปยังหน้าจอโฮม"</strong><br>(Add to Home Screen)</p>
        <button id="closeIosPrompt">รับทราบ</button>
    </div>

    <script>
        // 🟢 1. ดึง URL แบบเต็มของไฟล์นี้ (ตัดพวกเครื่องหมาย ? ต่อท้ายออกเพื่อความชัวร์)
        const currentUrl = window.location.origin + window.location.pathname;

        // 2. สร้าง Manifest ด้วย JavaScript
        const manifestData = {
            "id": "app-hsr-dashboard", 
            "name": "Dashboard สรุปข้อมูลครุภัณฑ์",
            "short_name": "ครุภัณฑ์ HSR",
            "display": "standalone",
            
            // 🟢 3. จุดสำคัญที่สุด: บังคับ Scope และ Start URL ให้ล็อคตายตัวที่ไฟล์นี้ไฟล์เดียว!
            "scope": currentUrl, 
            "start_url": currentUrl, 
            
            "background_color": "#ffffff",
            "theme_color": "#2563eb",
            "icons": [
                {
                    "src": "https://tephfkyo1011.github.io/research-office-dashboard/logo-hsr-dashboard.png",
                    "sizes": "512x512",
                    "type": "image/png",
                    "purpose": "any maskable"
                }
            ]
        };

        // 🟢 4. เปลี่ยนมาใช้ Base64 ในการเข้ารหัสแทน Blob (แก้ปัญหา Chrome สับสน Scope 100%)
        const base64Manifest = btoa(unescape(encodeURIComponent(JSON.stringify(manifestData))));
        document.getElementById('dynamic-manifest').href = 'data:application/manifest+json;base64,' + base64Manifest;

        // 5. เรียกใช้ Service Worker 
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
            .catch(err => console.log('Service Worker Error:', err));
        }

        // 6. โค้ดสำหรับจัดการปุ่มติดตั้งแอป
        let deferredPrompt;
        const installBtn = document.getElementById('installAppBtn');

        // ดักจับเมื่อเบราว์เซอร์พร้อมให้ติดตั้ง
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        // เมื่อผู้ใช้กดปุ่มติดตั้งของเรา
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('ผู้ใช้ยอมรับการติดตั้ง');
                    installBtn.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        // ซ่อนปุ่มอัตโนมัติ ถ้าแอปนี้ถูกติดตั้งลงเครื่องไปแล้ว
        window.addEventListener('appinstalled', () => {
            installBtn.style.display = 'none';
        });

        // 🟢 7. ตรวจจับและแสดงคำแนะนำสำหรับ iOS
        const isIos = () => {
            const userAgent = window.navigator.userAgent.toLowerCase();
            return /iphone|ipad|ipod/.test(userAgent);
        };

        const isInStandaloneMode = () => {
            return ('standalone' in window.navigator && window.navigator.standalone) || 
                   window.matchMedia('(display-mode: standalone)').matches;
        };

        if (isIos() && !isInStandaloneMode()) {
            const iosPrompt = document.getElementById('iosInstallPrompt');
            const closeIosBtn = document.getElementById('closeIosPrompt');
            
            iosPrompt.style.display = 'block';
            
            closeIosBtn.addEventListener('click', () => {
                iosPrompt.style.display = 'none';
            });
        }
    </script>

</body>
</html>
